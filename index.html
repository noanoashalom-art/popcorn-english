.opt{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px;min-height:58px;font-size:1.08rem;font-weight:500;text-align:center;transition:border-color .15s,background .15s,transform .1s;word-break:break-word}
.opt .oe{font-size:1.3rem}
.opt:hover:not([disabled]){border-color:var(--lav-2);background:var(--lav)}
.opt:active:not([disabled]){transform:scale(.98)}
.opt.right{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.opt.dim{opacity:.5}
.opt[disabled]{cursor:default}
.dkrow{display:flex;justify-content:center}
.dk{color:var(--muted);font-size:.9rem;padding:8px 14px;border-radius:999px}
.dk:hover{background:var(--sunk)}
.aopts{display:flex;flex-direction:column;gap:10px}
.aopt{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:8px 10px}
.aopt.right{border-color:var(--good);background:var(--good-bg)}
.aopt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.aopt.dim{opacity:.55}
.aplay{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;background:var(--lav);color:var(--plum);font-weight:500;flex:1}
.aplay svg{width:20px;height:20px}
.apick{padding:10px 18px;border-radius:12px;background:var(--plum);color:var(--on-plum);font-weight:600}
.aw{font-size:1.2rem;padding:0 10px}
.feedback{display:flex;flex-direction:column;gap:10px;animation:rise .25s ease}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px;border-radius:14px}
.fb svg{width:22px;height:22px}
.fb.good{background:var(--good-bg);color:var(--good)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb .oe{font-size:1.1rem}
.reveal{display:flex;align-items:center;gap:10px;font-size:1.8rem;justify-content:center}
.ruletip{background:var(--lav);color:var(--plum);border-radius:14px;padding:12px 14px;font-size:.95rem}
.why{font-size:.93rem;color:var(--muted)}
.ctx .reading{max-height:46vh;overflow:auto}

/* match & detective */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:8px}
.mt{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px;min-height:54px;font-size:1.05rem;font-weight:500}
.mt .en{font-size:1.15rem}
.mt.sel{border-color:var(--plum);background:var(--lav)}
.mt.done{border-color:transparent;background:var(--good-bg);color:var(--good);opacity:.7}
.mt.shake{animation:shake .35s;border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dw{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px;font-size:1.3rem;min-height:58px}
.dw.sel{border-color:var(--plum);background:var(--lav)}
.dw.right{border-color:var(--good);background:var(--good-bg)}
.dw.missed{border-color:var(--warn);background:var(--warn-bg)}
.dw.wrong{border-color:var(--bad);background:var(--bad-bg)}
.dw.dim{opacity:.5}

/* done */
.donecard{align-items:center;text-align:center;display:flex;flex-direction:column;gap:12px;padding:30px 20px}
.score{font-family:var(--f-en);font-variant-numeric:tabular-nums;color:var(--plum)}
.score b{font-size:4rem;font-weight:600;line-height:1}
.score span{font-size:1.6rem;color:var(--muted)}
.newmast{display:flex;gap:12px;align-items:flex-start;background:var(--good-bg);color:var(--good);border-radius:16px;padding:14px;text-align:start}
.newmast svg{width:28px;height:28px;flex:none}
.part-intro{display:flex;flex-direction:column;gap:8px;align-items:center}
.part-intro h2{margin:0;font-size:1.6rem}
.tipcard{display:flex;flex-direction:column;gap:8px;text-align:start;width:100%}
.tip-q{font-size:1.2rem}
.tip-he{font-weight:600}

/* sight & academic lists */
.row-card{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;text-align:start;box-shadow:var(--shadow)}
.gcard.cur{border:2px solid var(--plum)}
.gcard small{color:var(--muted);font-family:var(--f-en);font-variant-numeric:tabular-nums}
.g-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.g-words{color:var(--muted);font-size:.9rem;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flip{position:relative;min-height:220px;perspective:1000px;cursor:pointer}
.face{position:absolute;inset:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;backface-visibility:hidden;transition:transform .45s;padding:16px}
.face.fback{transform:rotateY(180deg);background:var(--lav)}
.flip.on .front{transform:rotateY(-180deg)}
.flip.on .fback{transform:rotateY(0)}

/* games */
.gamegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.game{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px;text-align:start;box-shadow:var(--shadow);position:relative;transition:transform .12s}
.game:hover{transform:translateY(-2px)}
.g-num{position:absolute;inset-inline-end:14px;top:10px;font-size:1.6rem;font-weight:600;color:var(--lav-2)}
.game b{font-size:1.05rem}
.g-en{font-size:.82rem;color:var(--plum)}
.game small{color:var(--muted)}
.g-count{font-size:.75rem;color:var(--good);margin-top:4px}

/* reading */
.tlist{display:flex;flex-direction:column;gap:8px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;text-align:start}
.t-title{font-size:1.1rem;font-weight:500;flex:1 1 100%}
.tcard small{color:var(--muted)}
.legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
i.lg{display:inline-block;width:14px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:middle}
i.lg.sw{border-bottom:3px solid var(--lav-2);background:transparent}
i.lg.ac{background:var(--pink)}
.reading{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;text-align:left;box-shadow:var(--shadow)}
.r-title{font-family:var(--f-en);font-size:1.3rem;margin:0 0 10px;font-weight:600;color:var(--plum)}
.r-body{font-family:var(--f-en);font-size:1.18rem;line-height:2}
.r-he{display:block;font-family:var(--f-he);font-size:.95rem;color:var(--muted);text-align:right;margin:2px 0 8px;line-height:1.5}
.tok{font-family:var(--f-en);font-size:inherit;border-radius:5px;padding:0 1px;line-height:1.5}
.tok:hover{background:var(--lav)}
.tok.sw{box-shadow:inset 0 -3px 0 var(--lav-2)}
.tok.ac{background:var(--pink);color:var(--rose);padding:0 3px}
.tr-btn{vertical-align:middle}

/* sheet, nav, toast */
.sheet-bg{position:fixed;inset:0;background:rgba(30,20,45,.35);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:24px 24px 0 0;padding:22px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;align-items:center;max-width:560px;margin:0 auto;box-shadow:0 -8px 30px rgba(40,20,60,.2);animation:rise .2s}
.sheet-w{font-size:2.4rem;font-weight:500}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
#nav button{flex:1;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;color:var(--muted);font-size:.76rem}
#nav svg{width:24px;height:24px}
#nav button.on{color:var(--plum);background:var(--lav);font-weight:600}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.92rem;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.ptile.nt{background:var(--sunk);color:var(--muted)}
.tagw.nt{background:var(--lav);color:var(--plum)}
.pgrid.wide{width:100%}
.stagecard{border:2px dashed var(--lav-2);box-shadow:none;gap:10px;display:flex;flex-direction:column}
.part-intro .owl{width:96px;height:96px}
.intro>.owl{align-self:center}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.cols2{grid-template-columns:1fr}}
.skills-d summary{list-style:none;align-self:flex-start;display:inline-flex}
.skills-d summary::-webkit-details-marker{display:none}
.skills-d[open] summary{background:var(--lav)}
.cols2.kl{margin-top:12px}
.skills-card{margin-top:12px;display:flex;flex-direction:column;gap:12px}

/* word audio */
.speaking{outline:3px dashed var(--speak)!important;outline-offset:2px;background:var(--speak-bg)!important}
.speaking .spk,.spk.speaking,.speaking .ospk,.ospk.speaking,.speaking .dw-say svg,.speaking .mt-spk{color:var(--speak)!important}
.spk.speaking,.ospk.speaking,.speaking>.spk,.speaking .ospk{background:var(--speak-bg)!important;animation:spkpulse .7s ease-in-out infinite}
@keyframes spkpulse{50%{transform:scale(1.12)}}
.ospk.speaking{transform:translateY(-50%);animation:none;outline:none!important}
.optw{position:relative;display:flex}
.optw .opt{flex:1;padding-inline-start:54px}
.optw.speaking .opt{background:var(--speak-bg)}
.optw.speaking{outline:none!important;background:transparent!important;border-radius:16px}
.optw.speaking .opt{outline:3px dashed var(--speak);outline-offset:2px}
.ospk{position:absolute;inset-inline-start:8px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:var(--lav);color:var(--plum);display:grid;place-items:center}
.ospk svg{width:19px;height:19px}
.opts.en-opts:has(> .optw:nth-child(3):last-child){grid-template-columns:1fr}
@media (max-width:420px){.opts.en-opts:has(> .optw){grid-template-columns:1fr}}
.pat-head{display:flex;align-items:center;gap:14px;justify-content:center;flex-wrap:wrap}
.pat-big{font-size:2.4rem;font-weight:600;color:var(--plum);line-height:1}
.pat-ex{display:flex;align-items:center;gap:8px;font-size:1.3rem;background:var(--sunk);padding:4px 6px 4px 14px;border-radius:999px}
.pat-ex .spk{width:32px;height:32px}
.dw{display:flex;flex-direction:column;gap:6px;padding:8px;font-size:1rem;min-height:0}
.dw-say{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 4px;border-radius:10px;font-size:1.35rem}
.dw-say svg{width:20px;height:20px;color:var(--plum);flex:none}
.dw-say:hover{background:var(--lav)}
.dw-pick{display:flex;align-items:center;justify-content:center;gap:6px;padding:7px;border-radius:999px;background:var(--sunk);color:var(--muted);font-size:.85rem;font-weight:500}
.dw-pick svg{width:16px;height:16px}
.dw.sel .dw-pick{background:var(--plum);color:var(--on-plum)}
.dw .dw-pick[disabled]{opacity:.7;cursor:default}
.mt{display:flex;align-items:center;justify-content:center;gap:8px}
.mt-spk{display:inline-grid;color:var(--plum);opacity:.7}.mt-spk svg{width:16px;height:16px}
.ex-w{border:0;cursor:pointer}
.ex-w .spk{width:34px;height:34px}
.wl-en{font-size:1.15rem;min-width:6.5rem;text-align:left}
.wlist li.speaking{border-radius:10px}
/* dictionary */
.dchoose{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.dchoose{grid-template-columns:1fr}}
.dopt{background:var(--plum);color:var(--on-plum);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:start;box-shadow:var(--shadow);transition:transform .12s}
.dopt:hover{transform:translateY(-2px)}
.dopt.alt{background:var(--pink);color:var(--rose)}
.dopt b{font-size:1.15rem}
.dopt small{opacity:.88}
.dopt-ic{width:44px;height:44px;border-radius:14px;background:color-mix(in srgb,currentColor 16%,transparent);display:grid;place-items:center;font-weight:600;font-size:1.1rem}
.dopt-ic svg{width:26px;height:26px}
.dlist{display:flex;flex-direction:column;gap:8px}
.dl{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;text-align:start}
.dl.cur{border:2px solid var(--plum)}
.dl.done{opacity:.8}
.dl-n{width:32px;height:32px;border-radius:50%;background:var(--lav);color:var(--plum);display:grid;place-items:center;font-weight:600;flex:none}
.dl.done .dl-n{background:var(--good-bg);color:var(--good)}
.dl-t{flex:1;min-width:0;display:flex;flex-direction:column}
.dl-t small{color:var(--plum)}
.dbadge{font-family:var(--f-en);display:grid;place-items:center;border-radius:50%;background:var(--lav);color:var(--plum);font-weight:600;font-size:.82rem}
.game:nth-child(3n+2) .dbadge{background:var(--pink);color:var(--rose)}
.game:nth-child(3n) .dbadge{background:var(--warn-bg);color:var(--warn)}
.tsteps{display:flex;gap:6px;flex-wrap:wrap}
.tstep{width:34px;height:34px;border-radius:50%;background:var(--sunk);color:var(--muted);font-family:var(--f-en);font-weight:600}
.tstep.on{background:var(--plum);color:var(--on-plum)}
.tstep.done{background:var(--lav-2);color:var(--plum)}
.dcard{display:flex;flex-direction:column;gap:12px}
.howto{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px}
.basebox{margin-top:8px;background:var(--lav);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.basebox ul{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:4px}
.basebox .en{font-weight:600;color:var(--plum);white-space:nowrap}
.dsearch{display:flex;gap:8px}
.dsearch input{flex:1;min-width:0;min-height:46px;border-radius:12px;border:2px solid var(--lav-2);background:var(--bg);color:var(--ink);padding:0 14px;font-family:var(--f-en);font-size:1.1rem}
.dsug{display:flex;gap:6px;flex-wrap:wrap;min-height:4px}
.chipbtn{padding:5px 12px;border-radius:999px;background:var(--lav);color:var(--plum);font-size:.92rem}
.chipbtn.on{background:var(--plum);color:var(--on-plum)}
.dmsg{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px}
.dentry{background:var(--bg);border:1px solid var(--line);border-inline-start:4px solid var(--plum);border-radius:12px;padding:12px 14px;text-align:left;width:100%;font-family:var(--f-en)}
.de-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.de-word{font-size:1.4rem;font-weight:600;color:var(--plum)}
.de-pron{color:var(--muted);font-size:1rem}
.de-head .spk{width:32px;height:32px}
.de-list{margin:8px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.de-pos{font-style:italic;color:var(--rose);font-family:var(--f-en);font-weight:500;margin-inline-end:4px}
.de-he{font-family:var(--f-he)}
.de-ex{margin-top:6px;color:var(--muted)}
.dentry .lit{background:var(--warn-bg);box-shadow:0 0 0 3px #F2B544;border-radius:6px;padding:0 4px}
.ptable{width:100%;border-collapse:collapse;font-size:.95rem}
.ptable td,.ptable th{padding:8px;border-bottom:1px solid var(--line);text-align:start}
.ptable th{color:var(--muted);font-weight:500;font-size:.85rem}
.ptable .spk{width:28px;height:28px;vertical-align:middle}
.big-nik{font-size:1.4rem}
.dles{display:flex;flex-direction:column;gap:12px}
.dles>.chip,.unit-head>.chip{align-self:flex-start}
.unit-head>.chip{align-self:center}
.rule-d{font-size:1.08rem;font-weight:500;background:var(--lav);color:var(--ink);border-radius:14px;padding:12px 14px}
.dtips{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px;color:var(--muted)}
.dex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:6px}
.dexc{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:14px;background:var(--sunk);font-size:1.15rem;flex-wrap:wrap}
.dexc.on{background:var(--good-bg);color:var(--good)}
.dexc .arr{color:var(--muted)}
.hew{font-family:var(--f-he);direction:rtl;unicode-bidi:isolate}
.he-s{font-size:1.3rem}
.dfunny{display:flex;flex-direction:column;gap:6px;background:var(--warn-bg);border-radius:14px;padding:12px}
.fun-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fun-row .bad{text-decoration:line-through;color:var(--bad)}
.fun-row .good{color:var(--good);font-weight:600}
.dpair{display:flex;flex-direction:column;gap:10px}
.dp{background:var(--sunk);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.signs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.signc{display:flex;flex-direction:column;gap:8px;align-items:stretch;text-align:center;background:none;padding:0}
.signc small{color:var(--muted)}
.signc .good{color:var(--good);font-weight:600}
.sign{background:#2F6F4E;color:#FFFFFF;border:3px solid #FFFFFF;outline:2px solid #2F6F4E;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px;font-weight:600;box-shadow:var(--shadow)}
.sign-en{font-family:var(--f-en);font-size:1.1rem}
.sign-he{font-family:var(--f-he);font-size:.95rem;opacity:.9}
.signc>.sign-he{color:var(--muted);opacity:1}
.sent-q .dentry{margin-top:10px;font-size:1rem}
.tagw.dk{background:var(--lav);color:var(--plum)}
.demo-need{background:var(--sunk);border-radius:14px;padding:12px;font-size:1.1rem;max-width:none}

/* learning path */
.path-wrap{gap:14px}
.path-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.path-top .h2 svg{width:24px;height:24px;color:var(--plum)}
.lv{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);min-width:0}
.lv.now.lv0{background:linear-gradient(180deg,var(--lav),var(--surface) 190px)}
.lv.now.lv1{background:linear-gradient(180deg,var(--pink),var(--surface) 190px)}
.lv.now.lv2{background:linear-gradient(180deg,var(--warn-bg),var(--surface) 190px)}
.lv-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.lv-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.lv-t h3{margin:0 0 4px;font-size:1.25rem;line-height:1.2}
.lv-chips{display:flex;gap:5px;flex-wrap:wrap}
.lv-chips span{font-size:.76rem;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--plum) 11%,transparent);color:var(--plum)}
.lv-p{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;color:var(--muted);flex:none}
.lv-crown svg{width:24px;height:24px;color:#E0A526}
.lv-lock svg{width:18px;height:18px}
.lv.locked{opacity:.72;box-shadow:none;background:var(--sunk)}
.lv-note{font-size:.86rem;color:var(--muted)}
.lv.done summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.lv.done summary::-webkit-details-marker{display:none}
.lv-sum{font-size:.82rem;color:var(--good);font-weight:500}

.pnode{position:absolute;width:68px;height:68px;display:block;--nc:#7354AE}

.pnode.skip .pn-c{background:color-mix(in srgb,var(--nc) 30%,var(--surface));color:var(--nc);box-shadow:0 5px 0 color-mix(in srgb,var(--nc) 30%,var(--line))}
.pnode.cur .pn-c{transform:scale(1.12);outline:4px solid color-mix(in srgb,var(--nc) 40%,transparent);outline-offset:4px;animation:pring 1.8s ease-in-out infinite}

.nsheet{text-align:center}

/* academic passages */
.pas{position:relative}

.tok.fw.wrong{background:var(--bad-bg);color:var(--bad)}
.qhead{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:6px}

.tpchip{display:inline-block;background:var(--warn-bg);color:var(--warn);font-size:.76rem;font-weight:600;padding:3px 9px;border-radius:999px}
.prompt .qen{display:block;font-size:1.15rem;line-height:1.45}
.qtools{display:flex;flex-wrap:wrap;gap:4px 8px;justify-content:center;align-items:center;width:100%}
.picks{display:flex;flex-direction:column;gap:8px}
.pk{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:1.05rem;text-align:left;direction:ltr}
.pk-box{width:24px;height:24px;border-radius:7px;border:2px solid var(--lav-2);display:grid;place-items:center;flex:none;color:var(--on-plum)}

.pk.sel{border-color:var(--plum);background:var(--lav)}
.pk.sel .pk-box{background:var(--plum);border-color:var(--plum)}
.pk.right{border-color:var(--good);background:var(--good-bg)}
.pk.right .pk-box{background:var(--good);border-color:var(--good)}
.pk.wrong{border-color:var(--bad);background:var(--bad-bg)}
.pk.wrong .pk-box{background:var(--bad);border-color:var(--bad)}

.model-box{background:var(--good-bg);color:var(--good);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}

.stratcard{width:100%;display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--lav),var(--pink));border:0;border-radius:var(--r);padding:16px;text-align:start;box-shadow:var(--shadow)}

.strat{display:flex;flex-direction:column;gap:12px}
.st-h{display:flex;align-items:center;gap:10px}

.pbars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}

.kwq{display:flex;flex-wrap:wrap;gap:6px;align-items:center;direction:ltr}

.kwt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.kwt.missed{border-style:dashed;border-color:var(--warn);color:var(--warn)}

const PHRASES = ACAD.filter(a => a.en.includes(' ')).map(a => a.en).sort((a, b) => b.length - a.length);
function lookup(w, T) {

  for (const c of cands) { if (AEN[c] && !AEN[c].en.includes(' ')) return { he: AEN[c].he, c: 'ac' }; }
  for (const c of cands) { if (SMAP[c] || SMAP[c === 'i' ? 'I' : c]) return { he: (SMAP[c] || SMAP['I']).he, c: 'sw' }; }
  for (const c of cands) { if (g[c]) return { he: g[c], c: '' }; if (ALLW[c]) return { he: ALLW[c], c: '' }; }

  phrases.forEach(p => { const r = new RegExp('\\b' + reEsc(p) + '\\b', 'g'); let m; while ((m = r.exec(lower))) { const a = m.index, b = a + p.length; if (!marks.some(x => a < x[1] && b > x[0])) marks.push([a, b, p]); } });
  marks.sort((a, b) => a[0] - b[0]);

    if (!/^[A-Za-z']+$/.test(t)) return esc(t);
    const L = lookup(t, T); return `<button class="tok ${L.c}" data-act="tok" data-w="${esc(t)}" data-he="${esc(L.he)}">${esc(t)}</button>`;
  }).join('');
  marks.forEach(([a, b, p]) => {
    out += words(s.slice(pos, a));
    const he = (AEN[p] && AEN[p].he) || (T.g && T.g[p]) || ''; const c = AEN[p] ? 'ac' : '';

}

const DENT = {

  benefit: { pr: '/ˈbɛnəfɪt/', m: [['n.', 'תועלת; יתרון'], ['v.', 'להפיק תועלת']], ex: 'Reading has many benefits.' },
  reason: { pr: '/ˈriːzn/', m: [['n.', 'סיבה'], ['v.', 'להסיק בהיגיון']], ex: 'What is the reason?' },
  point: { pr: '/pɔɪnt/', m: [['n.', 'נקודה'], ['n.', 'טענה; עיקר'], ['v.', 'להצביע']], ex: 'This is an important point.' },
  'lead¹': { pr: '/liːd/', m: [['v.', 'להוביל'], ['n.', 'הובלה; יתרון']], ex: 'She can lead the team.' },
  'lead²': { pr: '/lɛd/', m: [['n.', 'עופרת (מתכת)']], ex: 'Lead is a heavy metal.' }
};
const DKEYS = uniq(Object.keys(DENT).map(k => k.replace(/[¹²]/g, '')));
const POSHE = { 'n.': 'שם עצם', 'v.': 'פועל', 'adj.': 'שם תואר', 'adv.': 'תואר הפועל', 'prep.': 'מילת יחס', 'conj.': 'מילת קישור' };
const hw = k => k.replace(/[¹²]/g, '');
function entryHtml(k, o = {}) {
  const e = DENT[k], w = hw(k), part = o.part || '';
  return `<div class="dentry" dir="ltr" lang="en">
    <div class="de-head"><span class="de-word ${part === 'head' ? 'lit' : ''}">${esc(k)}</span>${spk(w, 'השמעת ' + w)}</div>
    ${o.pick ? '' : `<ol class="de-list">${e.m.map(([p, he]) => `<li><span class="de-pos ${part === 'pos' ? 'lit' : ''}" title="${POSHE[p] || ''}">${p}</span> <span class="de-he ${part === 'mean' ? 'lit' : ''}" dir="rtl" lang="he">${esc(he)}</span></li>`).join('')}</ol>
    ${o.ex ? `<p class="de-ex ${part === 'ex' ? 'lit' : ''}"><i>${esc(e.ex)}</i></p>` : ''}`}</div>`;
}
function dlookup(qs) {
  const q = (qs || '').trim().toLowerCase(); if (!q) return null;
  if (q === 'lead') return { keys: ['lead¹', 'lead²'] };
  if (DENT[q]) return { keys: [q] };
  const st = [q.replace(/ies$/, 'y'), q.replace(/es$/, ''), q.replace(/s$/, ''), q.replace(/ing$/, ''), q.replace(/ing$/, 'e'), q.replace(/ed$/, ''), q.replace(/ed$/, 'e'), q.replace(/(.)\1ing$/, '$1'), q.replace(/(.)\1ed$/, '$1')];
  const b = st.find(x => x !== q && (DENT[x] || x === 'lead'));
  return b ? { sug: b } : { none: true };
}
const dsug = q => { q = (q || '').trim().toLowerCase(); return q ? DKEYS.filter(k => k.startsWith(q) && k !== q).slice(0, 5) : []; };

/* path mascot: hops from the last step she stood on to the new current step */
function animateMascot() {
  const m = document.getElementById('pmascot'); if (!m || !P || !P.path) return;
  const to = m.dataset.key, from = P.path.mk; if (from === to) return;
  P.path.mk = to; save();
  if (!from || !m.animate || reducedMotion()) return;
  const nodes = [...m.parentNode.querySelectorAll('.pnode')], keys = nodes.map(n => n.dataset.k);
  const fi = keys.indexOf(from), ti = keys.indexOf(to), X0 = parseFloat(m.style.left), Y0 = parseFloat(m.style.top);
  const pt = i => [parseFloat(nodes[i].dataset.mx) - X0, parseFloat(nodes[i].dataset.my) - Y0];
  const fr = []; let hops = 1;
  if (fi >= 0 && ti >= 0 && fi !== ti) {
    const idx = [], dir = ti > fi ? 1 : -1, st = Math.abs(ti - fi) > 6 ? ti - dir * 6 : fi; for (let i = st; i !== ti + dir; i += dir) idx.push(i); hops = idx.length - 1;
    idx.forEach((i, j) => { const [dx, dy] = pt(i); if (j) { const [px, py] = pt(idx[j - 1]); fr.push({ transform: `translate(${(dx + px) / 2}px,${(dy + py) / 2 - 48}px) rotate(${dx > px ? 10 : -10}deg) scale(1.08)` }); } fr.push({ transform: `translate(${dx}px,${dy}px) scaleY(${j && j < idx.length - 1 ? 0.88 : 1})` }); });
  } else fr.push({ transform: 'translate(0,-170px) scale(.5)', opacity: 0 }, { transform: 'translate(0,-50px) scale(1.15)', opacity: 1, offset: 0.55 }, { transform: 'translate(0,6px) scaleY(.85)', offset: 0.8 }, { transform: 'translate(0,0) scale(1)' });
  const dur = Math.max(800, hops * 520);
  m.classList.add('moving');
  const a = m.animate(fr, { duration: dur, easing: 'ease-in-out' });
  for (let h = 0; h < hops; h++) setTimeout(() => SFX.play('hop', h), h * (dur / hops) + 60);
  a.onfinish = () => { m.classList.remove('moving'); const o = m.querySelector('.owl'); if (o) o.classList.add('cheer'); SFX.play('land'); const r = m.getBoundingClientRect(); confetti(14, false, r.left + r.width / 2, r.top + 10); };
}

  vpick: el => { TTS.choose(el.dataset.v); render(); const b = document.querySelector(`.vopt[data-v="${CSS.escape(el.dataset.v)}"]`); TTS.say('Reading every day can improve your English.', false, b); },
  voicetest: () => TTS.say('The main idea of the text is clear. Research shows that reading every day can improve your English.'),
  sayall: () => { const T = TEXTS.find(t => t.id === V.id); TTS.say(T.s.map(x => x[0]).join(' ')); },
  tok: el => { SHEET = { w: el.dataset.w, he: el.dataset.he }; TTS.say(el.dataset.w); render(); },
  'sheet-close': () => { SHEET = null; NS = null; GS = null; GSL = null; HELP = false; render(); },
  pnode: el => { const n = findNode(el.dataset.k); if (!n) return; const st = nodeState(n), cur = pathCurrent(); if (st === 'todo' && (!cur || cur.key !== n.key) && !nodeOpen(n, cur)) { toast(n.t === 'boss' ? 'הבוחן נפתח אחרי כל הצעדים בשלב' : 'הצעד הזה ייפתח בשלב הבא'); return; } SFX.play('tap'); NS = n.key; render(); },
  pstart: () => { const n = findNode(NS); NS = null; startNode(n, false); },
  pquick: () => { const n = findNode(NS); NS = null; startNode(n, true); },
  pjump: el => startJump(+el.dataset.k),
  fpick: el => { const q = Q && Q.q; if (!q || q.answered || q.t !== 'find') return; q.sel = el.dataset.w; render(); },
  fcheck: () => { const q = Q.q; if (q.t === 'find' && q.sel) answerCustom(q.find.includes(q.sel)); },
  fdk: () => { const q = Q.q; if (q.t === 'find') q.sel = null; answerCustom(false); },
  ppick: el => { const q = Q.q, i = +el.dataset.i; if (q.answered) return; if (q.sel.includes(i)) q.sel = q.sel.filter(x => x !== i); else { q.sel.push(i); if (q.sel.length > q.need) q.sel.shift(); } render(); },
  pcheck: () => { const q = Q.q; if (q.sel.length === q.need) answerCustom(q.sel.every(i => q.valid.includes(q.opts[i]))); },
  kw: () => { Q.q.showKw = true; render(); },
  s1: el => { V.s1 = +el.dataset.n; render(); if (V.s1 === 5) SFX.play('ok'); else SFX.play('bad'); },
  skw: el => { const i = +el.dataset.i; V.kw = V.kw || []; V.kw = V.kw.includes(i) ? V.kw.filter(x => x !== i) : [...V.kw, i]; render(); },
  skwc: () => { V.kwc = true; render(); },
  sdone: () => { P.stratSeen = true; if (PN && PN.tag === 'strat') { const up = markNode(PN.key); PN = null; checkAch(); save(); toast(up != null ? `שלב ${up + 1} הושלם!` : 'התקדמת במסלול!'); SFX.play('win'); go('home', { scrollPath: true }); return; } save(); toast('מעולה! עכשיו לתרגול'); go('read'); },
  pas: el => go('passage', { id: el.dataset.id }),
  pasv: el => startPasVocab(el.dataset.id),
  pasc: el => startPasComp(el.dataset.id),
  mpick: el => {
    const q = Q.q, i = +el.dataset.i; if (q.answered) return;
    if (el.dataset.side === 'L') { q.selL = i; q.shake = null; render(); TTS.say(q.pairs[i].en, false, document.querySelector(`.mt[data-side="L"][data-i="${i}"]`)); return; }
    if (q.selL == null) { toast('בחרי קודם מילה באנגלית'); return; }
    if (q.selL === i) { q.done.push(i); const p = q.pairs[i]; const ok = !q.miss.includes(i); if (p.k) itemRec(p.k, ok); skillRec('mean', ok); q.selL = null; q.shake = null; SFX.play('match', q.done.length); confetti(8, false, LASTXY.x, LASTXY.y); }
    else { if (!q.miss.includes(q.selL)) q.miss.push(q.selL); q.shake = i; SFX.play('bad'); }
    if (q.done.length === q.pairs.length) { q.answered = true; q.ok = q.miss.length <= 1; if (q.ok) { Q.ok++; P.stars = (P.stars || 0) + 2; SFX.play('win'); setTimeout(() => confetti(24), 60); } save(); }
    render();
  },
  dpick: el => { const q = Q.q, i = +el.dataset.i; if (q.answered) return; q.sel = q.sel.includes(i) ? q.sel.filter(x => x !== i) : [...q.sel, i]; render(); },
  dcheck: () => {
    const q = Q.q; if (q.answered) return; let all = true;
    q.words.forEach((w, i) => { const s = q.sel.includes(i), ok = s === w.ok; if (!ok) all = false; skillRec('dec', ok); if (w.ok) unitRec(q.unit, w.w, 'detect', ok, P.units[q.unit].st === 'mast', null); });
    q.answered = true; q.ok = all; if (all) { Q.ok++; P.stars = (P.stars || 0) + 2; } save(); render(); if (all) { SFX.play('win'); confetti(24); } else SFX.play('bad');
  }
};
Object.assign(ACT, {
  dtech: () => go('dtech', { st: 0 }),
  dscroll: () => { const el = document.getElementById('dlessons'); if (el) el.scrollIntoView({ behavior: 'smooth' }); },
  dles: el => go('dlesson', { id: el.dataset.id }),
  dprac: el => startDictPractice(el.dataset.id),
  dquick: el => startDictQuick(el.dataset.id),
  dreview: el => startDictReview(el.dataset.id),
  dgame: el => startDictGame(el.dataset.id),
  dtquiz: () => startTechQuiz(),
  dtstep: el => { V.st = +el.dataset.i; V.tpick = null; render(true); },
  dtnext: () => { V.st = Math.min(TSTEPS.length - 1, (V.st || 0) + 1); V.tpick = null; P.dict.tech.seen = true; if (P.dict.tech.st === 'nt') P.dict.tech.st = 'learn'; save(); render(true); },
  dtprev: () => { V.st = Math.max(0, (V.st || 0) - 1); V.tpick = null; render(true); },
  dsearch: () => { const i = document.getElementById('dsearch'); V.dq = i ? i.value : ''; render(); const r = dlookup(V.dq); if (r && r.keys) TTS.say(hw(r.keys[0])); },
  dpickw: el => { V.dq = el.dataset.w; render(); const r = dlookup(V.dq); if (r && r.keys) TTS.say(hw(r.keys[0])); },
  dpart: el => { V.part = V.part === el.dataset.p ? null : el.dataset.p; render(); },
  dpk: el => { const L = DLM[V.id]; V.dpk = +el.dataset.i; render(); if (L && L.demo && V.dpk === L.demo[2]) { SFX.play('ok'); confetti(12); } else SFX.play('bad'); },
  dtpick: el => { V.tpick = +el.dataset.i; render(); if (V.tpick === 1) { SFX.play('ok'); confetti(12); } else SFX.play('bad'); },
  drev: el => { const j = +el.dataset.i; V.rev[j] = !V.rev[j]; render(); const L = DLM[V.id]; if (V.rev[j] && L && L.ex && L.lang === 'en' && L.id !== 'names') TTS.say(L.ex[j][1]); }
});
function cardNext() {
  if (V.i < V.deck.length - 1) { V.i++; V.flip = false; render(); const w = V.deck[V.i]; setTimeout(() => TTS.say(w), 150); }
  else { save(); sightQuiz(V.g, uniq(V.deck)); }
}

function boot() {
  load(); TTS.init();
  try { SLOW = localStorage.getItem(KEY + '-slow') === '1'; SFX.on = localStorage.getItem(KEY + '-sfx') !== '0'; } catch (e) { }
  document.addEventListener('click', e => {
    LASTXY = { x: e.clientX, y: e.clientY };
    if (TOUR) { e.preventDefault(); e.stopPropagation(); tourNext(); return; }
    const el = e.target.closest('[data-act]');
    if (V.name === 'quiz' && Q && Q.q && Q.q.answered && Q.q.t !== 'info' && !SHEET && !HELP) {
      const a = el && el.dataset.act;
      if (a === 'say' || a === 'aplay' || a === 'tok') { if (Q.q._auto) scheduleAuto(2000); }
      else if (!['qexit', 'help', 'qhelp', 'kw', 'slow', 'sheet-close', 'switch'].includes(a) && !e.target.closest('.top')) { e.preventDefault(); clearTimeout(AUTO); nextQ(); return; }
    }
    if (!el || el.disabled) return;
    const f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el, e); }
  });
  document.addEventListener('toggle', e => { const d = e.target; if (d && d.dataset && d.dataset.keep) { if (d.open) OPEN.add(d.dataset.keep); else OPEN.delete(d.dataset.keep); } }, true);
  document.addEventListener('input', e => {
    if (e.target && e.target.id === 'dsearch') { const box = document.getElementById('dsug'); if (box) box.innerHTML = dsug(e.target.value).map(k => `<button class="chipbtn en" data-act="dpickw" data-w="${k}">${k}</button>`).join(''); }
  });
  document.addEventListener('change', e => {
    if (e.target && e.target.id === 'voicesel') {
      const v = (TTS.list || []).find(x => x.name === e.target.value);
      if (v) { TTS.voice = v; try { localStorage.setItem(KEY + '-voice', v.name); } catch (_) { } TTS.say('The main idea of the text is clear.'); }
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target && e.target.id === 'pname') { e.preventDefault(); ACT.newp(); }
    if (e.key === 'Enter' && e.target && e.target.id === 'dsearch') { e.preventDefault(); ACT.dsearch(); }
    if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.classList && e.target.classList.contains('flip')) { e.preventDefault(); ACT.flip(); }
    if (e.key === 'Escape' && TOUR) { tourEnd(); return; }
    if (e.key === 'Escape' && (SHEET || NS || GS || HELP)) { SHEET = null; NS = null; GS = null; HELP = false; render(); }
  });
  if (DB.cur && DB.profiles[DB.cur]) { enterProfile(DB.cur); V = { name: P.diag.done ? 'home' : 'diagintro' }; }
  render(true);
  addEventListener('resize', () => { if (TOUR) tourShow(); });
  lbInit();
}
boot();
})();
</script>

</html>
